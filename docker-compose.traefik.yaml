name: rclone
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:

  rclone:
    image: rclone/rclone:latest
    container_name: rclone-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rclone-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      RCLONE_CONFIG: /config/rclone.conf
    command: ['rcd', '--rc-no-auth', '--rc-addr', '0.0.0.0:5572']
    volumes:
      - './volumes/config/rclone/rclone.conf:/config/rclone.conf:ro'
      - './volumes/data/rclone:/data:z'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.rclone-rclone.entrypoints=http'
      - 'traefik.http.routers.rclone-rclone.rule=Host(${BASE_HOST_NAME:-$HOSTNAME})'
      - 'traefik.http.routers.rclone-rclone.middlewares=rclone-rclone-https-redirect'
      - 'traefik.http.middlewares.rclone-rclone-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.rclone-rclone-secure.entrypoints=https'
      - 'traefik.http.routers.rclone-rclone-secure.rule=Host(${BASE_HOST_NAME:-$HOSTNAME})'
      - 'traefik.http.routers.rclone-rclone-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.rclone-rclone-secure.service=rclone-rclone'
      - 'traefik.http.services.rclone-rclone.loadbalancer.server.port=5572'
    networks:
      - rclone
      - traefik

networks:
  rclone:
    name: rclone
    external: false
  traefik:
    name: traefik
    external: true
